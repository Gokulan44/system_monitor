# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Explicitly use Android Studio JBR (Java 21) so kapt and Gradle daemon don't pick up JDK 25 from system PATH
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
# AndroidX is required for all support-library-based dependencies.
android.useAndroidX=true
# Kotlin code style.
kotlin.code.style=official
# Only keep resource IDs of the module's own package in the R class.
android.nonTransitiveRClass=true
